name: AI evaluations

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ai:evals
        env:
          AI_EVAL_REAL: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_TEXT_MODEL: gpt-5.6-terra
